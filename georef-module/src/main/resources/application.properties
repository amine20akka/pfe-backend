# ================================================================================
# GEOREFERENCING MODULE - APPLICATION CONFIGURATION
# ================================================================================
# This configuration file contains all settings for the georeferencing module,
# which handles image upload, georeferencing processing, and GeoServer integration.
#
# Module Purpose:
#   - Accept image uploads for georeferencing
#   - Process images through GDAL server
#   - Store original and georeferenced images
#   - Publish georeferenced layers to GeoServer
#   - Manage asynchronous processing via RabbitMQ
# ================================================================================

# Application identifier
spring.application.name=georef-module


### ========== SERVER CONFIGURATION ==========
# Port on which the Spring Boot application runs
# Note: GeoServer runs on 8080, so this module uses 8081 to avoid conflicts
server.port=8081

# Include exception messages in HTTP error responses for better debugging
# Production consideration: Set to 'never' in production environments for security
server.error.include-message=always


### ========== GDAL SERVER ==========
# URL of the GDAL (Geospatial Data Abstraction Library) server
# This server performs the actual georeferencing operations on uploaded images
# Technology: Python Flask server with GDAL bindings
gdal.server.url=http://localhost:5000


### ========== GEOSERVER CONFIGURATION ==========
# GeoServer base URL for REST API and layer management
# GeoServer is used to serve the georeferenced images as WMS/WFS layers
geoserver.url=http://localhost:8080/geoserver

# GeoServer workspace where georeferenced layers will be published
# All layers created by this module are organized under this workspace
geoserver.workspace=georef

# GeoServer admin credentials for REST API authentication
# Security note: Use environment variables or secret management in production
geoserver.username=admin
geoserver.password=geoserver


### ========== DATABASE - POSTGRESQL ==========
# PostgreSQL database connection for storing georeferencing metadata
# Stores: image metadata, processing status, GCP coordinates, user info
spring.datasource.url=jdbc:postgresql://localhost:5432/pfe_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate ORM Configuration
# ddl-auto=update: Automatically updates database schema based on entity changes
# Use 'validate' in production to prevent accidental schema modifications
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console logs (useful for debugging)
# Set to false in production for performance
spring.jpa.show-sql=true

# Format SQL queries for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session In View pattern to prevent lazy loading issues
# Forces explicit transaction boundaries and prevents N+1 query problems
spring.jpa.open-in-view=false

# Default database schema for all entities
# All tables will be created/accessed under the 'georef' schema
spring.jpa.properties.hibernate.default_schema=georef


### ========== RABBITMQ MESSAGE BROKER ==========
# RabbitMQ connection settings for asynchronous image processing
# Used to decouple image upload from the time-consuming georeferencing process
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue name for image processing tasks
# Messages sent to this queue trigger the georeferencing workflow:
#   1. Image uploaded → Message sent to queue
#   2. Consumer picks up message
#   3. Image sent to GDAL server for processing
#   4. Result saved and published to GeoServer
georef.queue.image-processing=image.processing.queue


### ========== FILE STORAGE (Local Paths) ==========
# Base directory for all file storage operations
# Uses relative path for portability across environments
# The directory structure will be:
#   ./georef-storage/
#   ├── originals/        (uploaded images before processing)
#   └── georeferenced/    (processed images after georeferencing)
georef.storage.base-path=./georef-storage

# Directory for original uploaded images
# Images are preserved here for reprocessing or auditing purposes
# Uses Spring property placeholder syntax for path composition
georef.storage.original-dir=${georef.storage.base-path}/originals

# Directory for georeferenced/processed images
# Contains the final georeferenced outputs ready for GeoServer publishing
# Typically stored in GeoTIFF format with embedded spatial reference
georef.storage.georeferenced-dir=${georef.storage.base-path}/georeferenced


### ========== MULTIPART FILE UPLOAD ==========
# Maximum size for individual uploaded files
# Limits prevent server resource exhaustion from large uploads
# Adjust based on typical image sizes and available disk space
spring.servlet.multipart.max-file-size=10MB

# Maximum size for complete HTTP requests (including all files and form data)
# Should be >= max-file-size, increase if uploading multiple files per request
spring.servlet.multipart.max-request-size=10MB


### ========== JACKSON JSON SERIALIZATION ==========
# Configure enum serialization to use toString() method
# Ensures consistent enum representation in JSON responses
# Example: Status.PROCESSING serializes as "PROCESSING" instead of ordinal value
spring.jackson.serialization.WRITE_ENUMS_USING_TO_STRING=true

# Configure enum deserialization to use toString() method
# Allows flexible enum parsing from JSON requests
spring.jackson.deserialization.READ_ENUMS_USING_TO_STRING=true


### ========== SWAGGER/OPENAPI DOCUMENTATION ==========
# Path for OpenAPI JSON documentation
# Access the raw API specification at: http://localhost:8081/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# Path for Swagger UI interactive documentation
# Access the web interface at: http://localhost:8081/swagger-ui.html
# Provides interactive API testing and documentation browser
springdoc.swagger-ui.path=/swagger-ui.html


# ================================================================================
# DEPLOYMENT NOTES
# ================================================================================
# For production deployment, consider:
#   1. Use environment variables for sensitive credentials
#   2. Change server.error.include-message to 'never'
#   3. Set spring.jpa.show-sql to false
#   4. Use spring.jpa.hibernate.ddl-auto=validate
#   5. Implement proper SSL/TLS for all service connections
#   6. Use absolute paths or volume mounts for storage directories
#   7. Configure proper RabbitMQ clustering for high availability
#   8. Set up database connection pooling (HikariCP is default)
#   9. Implement proper backup strategy for both database and file storage
#   10. Monitor disk space usage in storage directories
# ================================================================================